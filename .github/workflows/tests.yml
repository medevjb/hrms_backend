name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # docs/PRD.md §140: tests run on MySQL, not sqlite, so DECIMAL/locking/date
    # semantics match production. mysql:8.0 here (not 9.x like local dev) purely
    # because it's the version GitHub's runners and the official image reliably
    # have on hand — config/database.php pins the collation explicitly so this
    # doesn't drift from local dev in the ways that would actually matter.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: hrms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # phpunit.xml points the test suite at hrms_test; the mysql service above
      # only auto-creates the `hrms` database (used by `composer setup`'s migrate).
      - name: Create test database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root \
            -e "CREATE DATABASE IF NOT EXISTS hrms_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
